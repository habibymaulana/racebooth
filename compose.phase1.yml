# App services only. PostgreSQL, n8n, and their storage are managed separately.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      PORT: "3000"
      PGHOST: photobooth-postgres
      PGPORT: "5432"
      PGDATABASE: photobooth_db
      PHOTO_STORAGE_PATH: /app/storage
    volumes:
      - photo-storage:/app/storage
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - photobooth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - photobooth

networks:
  photobooth:
    external: true
    name: photobooth-net

volumes:
  photo-storage:
    name: photobooth-photo-storage
